name: 🤖 RichYuni Cloud Multi-Blog Auto Publisher

on:
  schedule:
    # 1. 아침 포스팅: 매일 한국 시간(KST) 오전 08:30 (UTC 23:30)
    - cron: '30 23 * * *'
    # 2. 점심 포스팅: 매일 한국 시간(KST) 오후 12:30 (UTC 03:30)
    - cron: '30 3 * * *'
    # 3. 저녁 포스팅: 매일 한국 시간(KST) 오후 19:30 (UTC 10:30)
    - cron: '30 10 * * *'
  # 깃허브 웹 화면에서 [Run workflow] 버튼으로 언제든 즉시 수동 실행 가능
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 2. 파이썬 3.12 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. 필수 패키지 및 브라우저 로봇 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: 4. 아침/점심/저녁 자동 블로그 포스팅 실행
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_PW: ${{ secrets.NAVER_PW }}
          NAVER_BLOG_ID: ${{ secrets.NAVER_BLOG_ID }}
          KAKAO_ID: ${{ secrets.KAKAO_ID }}
          KAKAO_PW: ${{ secrets.KAKAO_PW }}
          TISTORY_BLOG_NAME: essay0606
        run: |
          python run_cloud_publisher.py
