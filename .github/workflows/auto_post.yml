name: 🤖 RichYuni Cloud Blog Auto Publisher

on:
  schedule:
    # 매일 한국 시간(KST) 오전 09:00 자동 실행 (UTC 00:00)
    - cron: '0 0 * * *'
  # 깃허브 웹 화면에서 [Run workflow] 버튼을 눌러 언제든 즉시 수동 실행도 가능
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 2. 파이썬 3.12 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 무인 블로그 자동 생성 및 포스팅 실행
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_PW: ${{ secrets.NAVER_PW }}
          NAVER_BLOG_ID: ${{ secrets.NAVER_BLOG_ID }}
          TISTORY_ACCESS_TOKEN: ${{ secrets.TISTORY_ACCESS_TOKEN }}
          TISTORY_BLOG_NAME: ${{ secrets.TISTORY_BLOG_NAME }}
        run: |
          python run_cloud_publisher.py

